services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.4-bookworm}
    volumes:
      - pokecoach2_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    restart: unless-stopped
    logging: &json_log
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  db-bootstrap:
    image: ${POSTGRES_IMAGE:-postgres:17.4-bookworm}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *json_log
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../scripts/bootstrap-roles.sh:/bootstrap/bootstrap-roles.sh:ro
    entrypoint: ["/bin/bash", "/bootstrap/bootstrap-roles.sh"]
    command: []

  flyway:
    build:
      context: ${FLYWAY_BUILD_CONTEXT:-../..}
      dockerfile: Dockerfile
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    logging: *json_log
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  postgraphile:
    build:
      context: ${POSTGRAPHILE_BUILD_CONTEXT:-../../../pokecoach2-postgraphile}
      dockerfile: Dockerfile
    depends_on:
      flyway:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *json_log
    ports:
      - "127.0.0.1:${POSTGRAPHILE_PORT:-4042}:4000"
    environment:
      DATABASE_URL: postgres://pokecoach_api:${API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCHEMA_NAMES: core
      PORT: "4000"
      SHUTDOWN_TIMEOUT: "5000"
      DEFAULT_PG_ROLE: authenticated_user
      PG_LIVE: "false"

  angular:
    profiles: ["frontend"]
    depends_on:
      postgraphile:
        condition: service_started
    build:
      context: ../../..
      dockerfile: pokecoach2-conception/docker/angular.Dockerfile
    ports:
      - "127.0.0.1:${ANGULAR_PORT:-8082}:80"
    restart: unless-stopped
    logging: *json_log

volumes:
  pokecoach2_pgdata:
