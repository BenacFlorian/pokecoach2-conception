# Extension Python — requires POKECOACH_PYTHON_IMAGE in .env.python
services:
  api-python:
    image: ${POKECOACH_PYTHON_IMAGE:?POKECOACH_PYTHON_IMAGE is required for the Python extension}
    depends_on:
      flyway:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    ports:
      - "127.0.0.1:${PYTHON_API_PORT:-8042}:8000"
    environment:
      APP_ENV: container
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: pokecoach_worker
      POSTGRES_PASSWORD: ${WORKER_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
